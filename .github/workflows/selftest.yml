name: Tests

on:
    pull_request:
    push:
      branches:
        - main
      tags:
        - 'v*.*.*'

env:
  DEN_DEBUG: true

jobs:
    test:
        runs-on: ${{ matrix.combo.os }}

        strategy:
            fail-fast: false
            matrix:
                combo:
                  - {os: macos-15-intel,   v: ^14}
                  - {os: macos-15-intel,   v: ^15}
                  - {os: macos-15-intel,   v: ""}

                  - {os: macos-15,         v: ^14}
                  - {os: macos-15,         v: ^15}
                  - {os: macos-15,         v: ""}

                  # Latest GNAT only: images with the 27 SDK list arm64e.x1 in
                  # libSystem.tbd, which the linker in GNAT up to 16.1 rejects.
                  # Fixed in 16.2.0-pre0, which "" selects on macOS.
                  - {os: macos-26-intel,   v: ""}
                  - {os: macos-26,         v: ""}

                  - {os: ubuntu-22.04,     v: ^10}
                  - {os: ubuntu-22.04,     v: ^11}
                  - {os: ubuntu-22.04,     v: ^12}
                  - {os: ubuntu-22.04,     v: ^13}
                  - {os: ubuntu-22.04,     v: ^14}
                  - {os: ubuntu-22.04,     v: ^15}
                  - {os: ubuntu-22.04,     v: ""}

                  - {os: ubuntu-22.04-arm, v: ^14}
                  - {os: ubuntu-22.04-arm, v: ^15}
                  - {os: ubuntu-22.04-arm, v: ""}

                  - {os: ubuntu-24.04,     v: ^14}
                  - {os: ubuntu-24.04,     v: ^15}
                  - {os: ubuntu-24.04,     v: ""}

                  - {os: ubuntu-24.04-arm, v: ^14}
                  - {os: ubuntu-24.04-arm, v: ^15}
                  - {os: ubuntu-24.04-arm, v: ""}

                  - {os: ubuntu-26.04,     v: ^14}
                  - {os: ubuntu-26.04,     v: ^15}
                  - {os: ubuntu-26.04,     v: ""}

                  - {os: ubuntu-26.04-arm, v: ^14}
                  - {os: ubuntu-26.04-arm, v: ^15}
                  - {os: ubuntu-26.04-arm, v: ""}

                  - {os: windows-2025,     v: ^10}
                  - {os: windows-2025,     v: ^11}
                  - {os: windows-2025,     v: ^12}
                  - {os: windows-2025,     v: ^13}
                  - {os: windows-2025,     v: ^14}
                  - {os: windows-2025,     v: ^15}
                  - {os: windows-2025,     v: ""}
                soft: [true, false]

        steps:
            - name: Enable/disable softlinks support in git
              run: git config --global core.symlinks ${{ matrix.soft }}

            - name: Check out den
              uses: actions/checkout@v2

            - name: Verify same example
              shell: bash
              run: cmp example/src/example.adb tests/src/example.adb

            - name: Set up Alire
              uses: alire-project/setup-alire@v5
              with:
                  version: nightly
                  toolchain: gnat_native${{matrix.combo.v}} gprbuild

            - name: Build in validation mode
              shell: bash
              run: |
                  alr build --validation

            - name: Enable new testsuite
              shell: bash
              run: |
                cat alire.toml | grep "^\[test\]$" || \
                  echo -e "[test]\nrunner = 'alire'" >> alire.toml

            - name: Test
              shell: bash
              run: |
                  alr test
